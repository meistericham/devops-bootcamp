services:
  profile:
    image: redis
    volumes:
      - me:/data

  server:
    image: ghcr.io/infratify/arena-server

  avatar:
    image: ghcr.io/infratify/arena-avatar
    ports:
      - "8080:8080"
    environment:
      NAME: AVATAR HISYAM
      COLOR: red
      SERVER: 13.212.241.150:3000
    depends_on:
      - profile
      - server

  avatar2:
    image: ghcr.io/infratify/arena-avatar
    ports:
      - "8081:8080"
    environment:
      NAME: AVATAR 2
      COLOR: cyan
      SERVER: server:3000
    depends_on:
      - profile
      - server

volumes:
  me: